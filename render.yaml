services:
  - type: web
    name: clinic-backend
    runtime: python
    pythonVersion: 3.12
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        scope: build,runtime
        sync: false
        value: postgresql+psycopg2://postgres.vshzowzmpbuzsyxjscoj:Dioga2508*+@aws-1-us-east-2.pooler.supabase.com:5432/postgres
      - key: SECRET_KEY
        scope: build,runtime
        sync: false
        # REQUIRED: Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: '["https://clinix-team.netlify.app"]'
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ALGORITHM
        value: HS256
      - key: PUBLIC_FRONTEND_URL
        value: https://clinix-team.netlify.app
